<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I'm Nikos.</title>
  <desc id="desc">A dark starfield and a blue planetary horizon. Animated text reads: Building things. Learning by doing.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#0d1117"/><stop offset="1" stop-color="#08121f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#469ee8" stop-opacity=".22"/><stop offset="1" stop-color="#469ee8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#142f46"/><stop offset=".45" stop-color="#0a1927"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1">
      <stop stop-color="#0d1117"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#1e4563"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1040" height="340" rx="16"/></clipPath>
    <clipPath id="typing"><rect class="reveal" x="64" y="220" width="530" height="36"/></clipPath>
  </defs>
  <style>
    .reveal { animation: type 12s steps(34, end) infinite; }
    .cursor { animation: cursor-move 12s steps(34, end) infinite, blink 1s step-end infinite; }
    @keyframes type { 0%, 8% { width: 0; } 48%, 92% { width: 530px; } 100% { width: 0; } }
    @keyframes cursor-move { 0%, 8% { transform: translateX(0); } 48%, 92% { transform: translateX(530px); } 100% { transform: translateX(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; width: 530px; }
      .cursor { animation: none; opacity: 0; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1040" height="340" fill="url(#space)"/>
    <ellipse cx="890" cy="265" rx="275" ry="250" fill="url(#glow)"/>
    <g fill="#c9d5e5">
      <circle cx="470" cy="40" r="1" opacity=".35"/><circle cx="630" cy="80" r="1.4" opacity=".6"/>
      <circle cx="750" cy="40" r="1" opacity=".5"/><circle cx="840" cy="90" r="1.2" opacity=".7"/>
      <circle cx="976" cy="49" r="1" opacity=".5"/><circle cx="939" cy="135" r="1.5" opacity=".6"/>
      <circle cx="683" cy="180" r="1" opacity=".4"/><circle cx="580" cy="295" r="1" opacity=".4"/>
      <circle cx="777" cy="280" r="1.2" opacity=".3"/><circle cx="993" cy="245" r="1" opacity=".5"/>
      <circle cx="327" cy="292" r=".8" opacity=".4"/><circle cx="54" cy="288" r="1" opacity=".35"/>
      <circle cx="354" cy="50" r=".8" opacity=".3"/><circle cx="720" cy="117" r=".8" opacity=".6"/>
    </g>
    <g fill="none" stroke="#5ea8d3">
      <ellipse cx="882" cy="248" rx="180" ry="62" transform="rotate(-33 882 248)" opacity=".24"/>
      <ellipse cx="882" cy="248" rx="215" ry="80" transform="rotate(-33 882 248)" opacity=".10"/>
    </g>
    <circle cx="917" cy="402" r="183" fill="url(#planet)" stroke="url(#rim)" stroke-width="1.7"/>
    <path d="M744 342 A183 183 0 0 1 1040 266" fill="none" stroke="#7dd3fc" stroke-opacity=".1" stroke-width="9"/>
    <circle cx="758" cy="280" r="4" fill="#a5dcf9"/>
    <circle cx="758" cy="280" r="9" fill="none" stroke="#a5dcf9" opacity=".25"/>
    <path d="M874 45v12m-6-6h12" fill="none" stroke="#9bd6f7" stroke-width="1.3" opacity=".8"/>
    <text x="64" y="69" fill="#8ba3ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="4">A PERSONAL ORBIT</text>
    <text x="60" y="163" fill="#f0f6fc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="650" letter-spacing="-3">Hey, I'm Nikos.</text>
    <text x="64" y="247" fill="#8bd5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" textLength="530" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing)">Building things. Learning by doing.</text>
    <path class="cursor" d="M65 226v26" stroke="#8bd5ff" stroke-width="2"/>
    <path d="M64 291h40" stroke="#5684a5" stroke-width="2"/>
    <text x="119" y="296" fill="#71889f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="3">BUILD / EXPERIMENT / EXPLORE</text>
  </g>
</svg>
