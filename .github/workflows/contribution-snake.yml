name: Update contribution snake

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish contribution animation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out this profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light and dark animations from GitHub contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ runner.temp }}/profile-snake/github-snake.svg?color_snake=#0284c7&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0284c7
            ${{ runner.temp }}/profile-snake/github-snake-dark.svg?palette=github-dark&color_snake=#8bd5ff&color_dots=#161b22,#17364a,#245a78,#3888ae,#7dd3fc

      - name: Publish generated SVGs to the output branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin output > /dev/null; then
            git fetch origin output
            git switch --create output FETCH_HEAD
          else
            git switch --orphan output
          fi
          cp "$RUNNER_TEMP/profile-snake/github-snake.svg" .
          cp "$RUNNER_TEMP/profile-snake/github-snake-dark.svg" .
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animation is already up to date."
            exit 0
          fi
          git commit -m "Update contribution snake"
          git push origin HEAD:output
